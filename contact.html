    <div class="contactUs">
        <div class="box">
            <div class="contact form">
                <h3>Send us a message</h3>
                <form>
                    <div class="formBox">
                        <div class="row50">
                            <div class="inputBox">
                                <span>First Name</span>
                                <input type="text" required="required" placeholder="First Name">
                                <span>Last Name</span>
                                <input type="text" required="required" placeholder="Last Name">
                            </div>
                        </div>

                        <div class="row50">
                            <div class="inputBox">
                                <span>Email</span>
                                <input type="text"  required="required" placeholder="Email">
                                <span>Mobile</span>
                                <input type="text" required="required" placeholder="+357 99335544">
                            </div>
                        </div>

                        <div class="row100">
                            <div class="inputBox">
                                <span>Message</span>
                                <textarea placeholder="Write your message here..."></textarea>
                            </div>
                        </div>

                        <div class="row100">
                            <div class="inputBox">
                                <input type="submit" value="Send">
                            </div>
                        </div>
                    </div>
                </form>
            </div>

            <div class="contact info">
                <h3>Contact Info</h3>
                <div class="infoBox">
                    <div>
                        <span><ion-icon name="location-outline"></ion-icon></span>
                        <p> Arch. Kyprianou 31, 3036 Limassol, Cyprus, <br>Cyprus University of Technology</p>
                    </div>
                    <div>
                        <span><ion-icon name="mail-outline"></ion-icon></span>
                        <a href="mailto:mnemosyne@cut.ac.cy">mnemosyne@cut.ac.cy</a>
                    </div>
                    <div>
                        <span><ion-icon name="call-outline"></ion-icon></span>
                        <a href="tel:+35725002020">+357-25002020</a>
                    </div>
                    <!--Social Media-->
                    <ul class="sci">
                        <li><a href="https://www.facebook.com/Unesco.DCH"><ion-icon name="logo-facebook"></ion-icon></a></li>
                        <li><a href="https://twitter.com/UNESCO_DCH_ERA/"><ion-icon name="logo-twitter"></ion-icon></a></li>
                        <li><a href="https://www.youtube.com/@DigitalHeritageResearchLab"><ion-icon name="logo-youtube"></ion-icon></a></li>
                        <li><a href="https://www.instagram.com/mnemosyne_eu"><ion-icon name="logo-instagram"></ion-icon></a></li>
                    </ul>
                </div>
            </div>
