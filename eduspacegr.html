    <link href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css' rel='stylesheet'>
    <link href='https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css' rel='stylesheet'>
    <link href='https://cdn.jsdelivr.net/npm/wowjs@1.1.3/css/libs/animate.min.css' rel='stylesheet'>
    <link href='https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css' rel='stylesheet'>

    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: url('./img/woodbg.png') no-repeat center center fixed;
            background-size: cover;
            padding: 20px;
            box-sizing: border-box;
            filter: blur(10px); /* Initial blur effect */
            transition: filter 0.5s; /* Smooth transition */
        }
        body.loaded {
            filter: none; /* Remove blur when loaded */
        }
        .header {
            width: 100%;
        }
        .plank {
            display: flex;
            justify-content: center;
            width: 100%;
            margin: 20px 0;
        }
        .plank img {
            max-width: 100%;
            height: auto;
        }
        .porthole-container-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            width: 100%;
            margin-top: -50px; /* Adjust this value to move the porthole containers up */
        }
        .porthole-container {
            position: relative;
            width: 45%;
            max-width: 300px; /* Adjust size as needed */
            margin: 10px;
        }
        .porthole-container img {
            width: 100%;
            height: auto;
        }
        .porthole-container .fishing-bobber {
            position: absolute;
            top: 68%; /* Adjusted value to move the bobber down */
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff; /* Text color */
            font-size: 16px;
            font-weight: bold;
            text-decoration: none; /* Remove underline from link text */
            animation: bobber 2s infinite ease-in-out;
        }
        .porthole-container .fishing-bobber:hover {
            color: #e1e1e1; /* Change text color on hover */
            text-decoration: underline;
        }
        @keyframes bobber {
            0%, 100% {
                transform: translate(-50%, -40%);
            }
            50% {
                transform: translate(-50%, -60%);
            }
        }
        @media (max-width: 768px) {
            .porthole-container {
                width: 80%;
            }
            .porthole-container-wrapper {
                margin-top: 0; /* Adjust this value for smaller screens */
            }
        }
        @media (max-width: 480px) {
            .porthole-container {
                width: 90%;
            }
            .porthole-container-wrapper {
                margin-top: -70px; /* Adjust this value for smallest screens */
            }
            .porthole-container {
                width: 80%; /* Adjust this value for smallest screens */
            }
        }

        img.bg-img.loaded {
            opacity: 1;
        }

        /* Disable hover effect for plank and porthole images */
        .plank img:hover,
        .porthole-container img:hover {
            transform: none;
        }
    </style>
</head>
