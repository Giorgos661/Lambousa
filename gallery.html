    <script type="text/javascript">
        $(document).ready(function(){
        $('.list').click(function(){
            const value = $(this).attr('data-filter');
            if(value === 'all'){
                $('.photo').show('1000');
            } else {
                $('.photo').hide();
                $('.' + value.toLowerCase()).show('1000');
            }
            $(this).addClass('active').siblings().removeClass('active');
        });
    });
    </script>
